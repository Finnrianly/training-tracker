<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#1F4FD1"/>
  <!-- Three ascending bars -->
  <rect x="100" y="340" width="86" height="120" rx="14" fill="white"/>
  <rect x="213" y="248" width="86" height="212" rx="14" fill="white"/>
  <rect x="326" y="152" width="86" height="308" rx="14" fill="white"/>
  <!-- Upward trend line connecting bar tops -->
  <polyline
    points="143,340 256,248 369,152"
    fill="none" stroke="white" stroke-width="16"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
</svg>
