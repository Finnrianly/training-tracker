<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#1F4FD1">

  <!-- iOS home-screen install -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="apple-touch-icon" href="./icons/icon.svg">

  <title>Training Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="screens">
      <div id="screen-today" class="screen" data-screen="today">
        <header class="screen-header">
          <h1>Today</h1>
        </header>
        <div class="screen-body" id="today-body">
        </div>
      </div>

      <div id="screen-sleep" class="screen hidden" data-screen="sleep">
        <header class="screen-header">
          <h1>Sleep</h1>
        </header>
        <div class="screen-body" id="sleep-body">
        </div>
      </div>

      <div id="screen-week" class="screen hidden" data-screen="week">
        <header class="screen-header">
          <h1>Week</h1>
        </header>
        <div class="screen-body" id="week-body">
        </div>
      </div>

      <div id="screen-history" class="screen hidden" data-screen="history">
        <header class="screen-header">
          <h1>History</h1>
        </header>
        <div class="screen-body" id="history-body">
        </div>
      </div>

      <div id="screen-settings" class="screen hidden" data-screen="settings">
        <header class="screen-header">
          <h1>Settings</h1>
        </header>
        <div class="screen-body" id="settings-body">
        </div>
      </div>
    </main>

    <nav id="tab-bar" role="tablist" aria-label="Main navigation">
      <button class="tab active" data-screen="today" role="tab" aria-selected="true" aria-label="Today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>Today</span>
      </button>
      <button class="tab" data-screen="sleep" role="tab" aria-selected="false" aria-label="Sleep">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span>Sleep</span>
      </button>
      <button class="tab" data-screen="week" role="tab" aria-selected="false" aria-label="Week">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
          <line x1="2" y1="20" x2="22" y2="20"/>
        </svg>
        <span>Week</span>
      </button>
      <button class="tab" data-screen="history" role="tab" aria-selected="false" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span>History</span>
      </button>
      <button class="tab" data-screen="settings" role="tab" aria-selected="false" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/score.js"></script>
  <script src="js/today.js"></script>
  <script src="js/sleep.js"></script>
  <script src="js/week.js"></script>
  <script src="js/history.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/sample.js"></script>
</body>
</html>
